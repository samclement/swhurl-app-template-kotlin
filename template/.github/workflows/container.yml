name: Container

# Checks and publishes this app with the workflow shared by every app from the swhurl Kotlin template
# (its app.yml). Keep this file as it is: fixes to the shared workflow arrive without editing it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  app:
    uses: samclement/swhurl-app-template-kotlin/.github/workflows/app.yml@main
