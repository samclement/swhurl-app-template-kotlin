name: App

# The checks and image build every swhurl app runs, shared from the template: each app's
# .github/workflows/container.yml calls this file at
# samclement/swhurl-app-template-kotlin/.github/workflows/app.yml@v…; Renovate updates each released pin (like renovate-preset.json). The image build runs Gradle checks and packages
# the app in one invocation, then smoke-tests it (it starts, answers /healthz and keeps running).
# Pushes to main then push the image to GHCR tagged <run number>-<short sha> (for example 42-a1b2c3d); the platform's image
# automation deploys the highest run number to staging, and the job summary prints image@digest. Every image
# also states what it needs in one config label (platform.swhurl.com/declaration), from swhurl.yaml and the
# events document it names; v2's image automation reads it with the manifest, and the template's own CI
# asserts it for every app type.
# The template's own Template workflow calls it with template: true: it renders the template with
# Copier into ./app (as the platform's make app-repo does), checks and smoke-tests that, and publishes
# nothing.

on:
  workflow_call:
    inputs:
      template:
        description: Render the Copier template into ./app and check that instead (publishes nothing)
        type: boolean
        default: false
      answers:
        description: "With template: Copier answers, space-separated key=value (for example kind=worker database=none api=none)"
        type: string
        default: ''

      reuse-pr-image:
        description: Retain tested own-repository PR images for one day; matching main merges publish them
        type: boolean
        default: false

# Inherit the caller's permissions. New callers grant actions: read for artifacts;
# workflow-only upgrades of older callers need no additional scope until they opt in.

env:
  # The template's own CI publishes the image it built and smoke-tested for each set of answers in its
  # Template workflow as seed-<commit>-<kind>-<database>-<api> (the values in that order); a new app's first run
  # copies the one for its own answers (the seed job). Those sets are the platform's app types, the only
  # answers the template accepts. The image does not depend on the app's name: the platform gives it its
  # name and description at runtime.
  SEED_IMAGE: ghcr.io/samclement/swhurl-app-template-kotlin

jobs:
  # A new app's first run: copy the template's image for the same answers and revision, already built
  # and smoke-tested by the template's own CI on main, to this app's 0-<sha>. The platform can then
  # deploy the app at once; this run's own build publishes <run>-<sha>, which image automation deploys
  # next (1 sorts above 0). No seed for that revision (older than 30 days, or answers from before the
  # types): the build is the first image. It never fails the run.
  seed:
    name: Seed the first image
    if: ${{ !inputs.template && github.event_name == 'push' && github.run_number == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Find the template's image for these answers
        id: seed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          answers=$(for question in kind database api; do
            printf '%s=%s ' "$question" "$(sed -n "s/^$question: *//p" .copier-answers.yml | head -1)"
          done)
          answers=${answers% }
          slug=$(printf '%s' "$answers" | sed 's/[a-z]*=//g; s/ /-/g')   # web-sqlite-openapi
          ref=$(sed -n 's/^_commit: *//p' .copier-answers.yml | head -1)
          case "$ref" in *-g*) ref=${ref##*-g} ;; esac   # git describe: v0.2.11-3-g1a2b3c4
          if ! sha=$(gh api "repos/samclement/swhurl-app-template-kotlin/commits/$ref" --jq .sha); then
            echo "No seed: cannot resolve template revision $ref." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "source=$SEED_IMAGE:seed-$sha-$slug" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: steps.seed.outputs.source
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy it as this app's first image
        if: steps.seed.outputs.source
        env:
          SOURCE: ${{ steps.seed.outputs.source }}
        run: |
          set -uo pipefail
          target="ghcr.io/${GITHUB_REPOSITORY,,}:0-${GITHUB_SHA::7}"
          if docker buildx imagetools create --tag "$target" "$SOURCE"; then
            echo "Seeded \`$target\` from \`$SOURCE\`; this run's build publishes the app's own image next." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No seed: \`$SOURCE\` is not published (the template's CI keeps 30 days of seeds, for the app types' answers); this run's build is the first image." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Check, build and smoke-test
    runs-on: ubuntu-latest
    env:
      APP_DIR: ${{ inputs.template && 'app' || '.' }}
      PUBLISH: ${{ !inputs.template && github.event_name != 'pull_request' }}
      CHECK_EXPORT: ${{ inputs.template && inputs.answers == 'kind=web database=sqlite api=openapi' }}  # the Template workflow's first matrix entry, exactly
      REUSE_ENABLED: ${{ !inputs.template && inputs.reuse-pr-image && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    defaults:
      run:
        working-directory: ${{ inputs.template && 'app' || '.' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The platform's own commands: the label an image states about itself (every build) and the tested PR
      # image an app may reuse. Pinned, so changing either is a template change.
      - name: Checkout the platform's helper commands
        uses: actions/checkout@v7
        with:
          repository: samclement/swhurl-platform
          ref: 1d51e4ee349e7e9354da5a32b394866cbb8d1279
          path: .swhurl-platform
          sparse-checkout: tools
          persist-credentials: false

      - name: Keep helper and image exports outside the app context
        working-directory: .
        run: |
          mv .swhurl-platform "$RUNNER_TEMP/swhurl-platform"
          mkdir -p "$RUNNER_TEMP/swhurl-image"

      - name: Identify build inputs and find a tested PR image
        if: env.REUSE_ENABLED == 'true'
        id: candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export PYTHONPATH="$RUNNER_TEMP/swhurl-platform/tools"
          python3 -m swhurl app-build-image prepare --state "$RUNNER_TEMP/swhurl-image/state.json" \
            --recipe samclement/swhurl-app-template-kotlin@v0.2.5 --target runtime

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false

      - name: Render the template (template only)
        if: inputs.template
        working-directory: .
        env:
          ANSWERS: ${{ inputs.answers }}
        run: |
          data=()
          for answer in $ANSWERS; do data+=(--data "$answer"); done
          uvx copier@9.18.2 copy --defaults --vcs-ref HEAD --data app_name=smoke-app "${data[@]}" . app
          test -f app/.copier-answers.yml && test -f app/swhurl.yaml && grep -q '^# smoke-app$' app/README.md
          cat app/swhurl.yaml

      # What this image needs, for the platform's image automation: one config label from swhurl.yaml and the
      # events document it names, by the platform's own reader (checked out above). Both builds below carry
      # it, because a PR's tested image is published unchanged when main merges and the seed is this image.
      - name: What the image states
        id: declaration
        env:
          PYTHONPATH: ${{ runner.temp }}/swhurl-platform/tools
        run: |
          set -Eeuo pipefail
          label=$(uv run --no-project --with PyYAML==6.0.3 -- python -m swhurl image-declaration --app-dir .)
          echo "labels=$label" >> "$GITHUB_OUTPUT"
          echo "- declaration: \`$label\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Image name and tag
        id: meta
        env:
          ANSWERS: ${{ inputs.answers }}
          TEMPLATE: ${{ inputs.template }}
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          # One build cache per template combination: parallel matrix jobs sharing a scope overwrite each
          # other's cache, so every run rebuilt from the dependency layer. An app keeps the default scope.
          scope=buildkit
          if [ -n "$ANSWERS" ]; then scope="template-$(tr ' =' '-_' <<<"$ANSWERS")"; fi
          # A new app's repository starts with an empty GitHub Actions cache, so its first build would
          # install every dependency again. The template's own runs on main therefore also write a registry
          # cache (public package, one tag per kind, database and API); every app reads it as a fallback. The
          # dependency layers depend only on Gradle files and the Dockerfile, so they hit for any app.
          # An unreadable or missing registry cache is a warning, not a failure.
          # Gradle's actual inputs also normalise a worker's API to none. Events change source, not dependencies.
          kind=$(sed -n 's/^swhurl.kind=//p' gradle.properties)
          database=$(sed -n 's/^swhurl.database=//p' gradle.properties)
          api=$(sed -n 's/^swhurl.api=//p' gradle.properties)
          shared="ghcr.io/samclement/swhurl-app-template-kotlin-cache:${kind:-web}-${database:-none}-${api:-none}"
          legacy="ghcr.io/samclement/swhurl-app-template-kotlin-cache:${kind:-web}-${database:-none}"
          {
            echo "cache-from<<EOF"
            echo "type=gha,scope=$scope"
            echo "type=registry,ref=$shared"
            # Keep old template caches available while the new tags warm up.
            echo "type=registry,ref=$legacy"
            echo "EOF"
            echo "cache-to<<EOF"
            # An app does not write its own Actions cache: exporting every layer, base image included, was most
            # of the TypeScript template's remaining first-build time, and the shared registry cache already
            # serves the dependency layers.
            if [ "$TEMPLATE" = true ]; then echo "type=gha,scope=$scope,mode=max"; fi
            if [ "$TEMPLATE" = true ] && [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
              echo "type=registry,ref=$shared,mode=max,image-manifest=true,oci-mediatypes=true"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Writing the shared registry cache (template pushes to main) needs the login before the build;
      # the publish login further down stays for apps. Everything else reads the cache anonymously.
      - name: Login to GHCR (template cache write)
        if: inputs.template && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        if: steps.candidate.outputs.reuse != 'true'
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: ${{ steps.candidate.outputs.builder_image && format('image={0}', steps.candidate.outputs.builder_image) || '' }}

      - name: Build the image
        if: steps.candidate.outputs.reuse != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.APP_DIR }}
          file: ${{ steps.candidate.outputs.dockerfile || format('{0}/Dockerfile', env.APP_DIR) }}
          target: ${{ env.REUSE_ENABLED == 'true' && 'runtime' || '' }}
          platforms: linux/amd64
          load: ${{ !(steps.candidate.outputs.retain == 'true' || env.CHECK_EXPORT == 'true') }}
          provenance: ${{ (steps.candidate.outputs.retain == 'true' || env.CHECK_EXPORT == 'true') && 'mode=max' || '' }}
          outputs: ${{ (steps.candidate.outputs.retain == 'true' || env.CHECK_EXPORT == 'true') && format('type=oci,dest={0}/swhurl-image/image.oci.tar', runner.temp) || '' }}
          labels: |
            ${{ steps.declaration.outputs.labels }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: app:smoke
          cache-to: ${{ steps.meta.outputs.cache-to }}
          cache-from: ${{ steps.meta.outputs.cache-from }}

      - name: Load exported runtime for smoke tests
        if: steps.candidate.outputs.retain == 'true' || env.CHECK_EXPORT == 'true'
        env:
          PYTHONPATH: ${{ runner.temp }}/swhurl-platform/tools
        run: |
          python3 -m swhurl app-build-image load --state "$RUNNER_TEMP/swhurl-image/state.json" \
            --archive "$RUNNER_TEMP/swhurl-image/image.oci.tar"

      # Runs the image as the cluster does, from the app's swhurl.yaml (a web app on /healthz without one):
      # read-only root filesystem with a writable /tmp, the database (if any) on a writable /data. A web app
      # must answer its health path and /; every app must keep running.
      - name: Smoke test (starts, answers its health path if web, keeps running)
        if: steps.candidate.outputs.reuse != 'true'
        run: |
          set -Eeuo pipefail
          field() { if [ -f swhurl.yaml ]; then sed -n "s/^$1: *//p" swhurl.yaml | head -1; fi; }
          trap 'result=$?; if [ "$result" -ne 0 ]; then docker logs smoke || true; fi' EXIT
          stays_running() {
            for _ in 1 2 3 4; do
              sleep 1
              [ "$(docker inspect -f '{{.State.Running}}' smoke)" = true ] || return 1
            done
          }
          kind=$(field kind); kind=${kind:-web}; database=$(field database)
          args=(--read-only --tmpfs /tmp)
          if [ "$database" = sqlite ]; then data_dir=$(mktemp -d); chmod 1777 "$data_dir"; args+=(-v "$data_dir:/data" -e DATABASE_PATH=/data/app.db); fi
          port=$(field port); port=${port:-8080}   # where the image listens: swhurl.yaml's port, as on the platform
          if [ "$kind" = web ]; then args+=(-p "18080:$port"); fi
          docker run -d --name smoke "${args[@]}" app:smoke
          SECONDS=0
          if [ "$kind" = job ]; then
            # A job runs once and ends: it must end, with status 0, within the same 120 s allowance.
            code=$(timeout 120 docker wait smoke) || { echo "the job did not end within 120 s"; docker logs smoke; exit 1; }
            docker logs smoke
            [ "$code" = 0 ] || { echo "the job ended with status $code"; exit 1; }
            echo "the job ended with status 0 after ${SECONDS} s"
          fi
          if [ "$kind" = web ]; then
            path=$(field healthPath); path=${path:-/healthz}
            # Up to 120 s: the start-up allowance the platform gives every web app (its startup probe).
            for _ in $(seq 1 120); do
              curl -fsS "http://127.0.0.1:18080$path" 2>/dev/null && break
              sleep 1
            done
            echo "answered $path after ${SECONDS} s of the 120 s allowed"
            curl -fsS "http://127.0.0.1:18080$path" >/dev/null || { docker logs smoke; exit 1; }
            curl -fsS http://127.0.0.1:18080/ >/dev/null || { docker logs smoke; exit 1; }
          fi
          [ "$kind" = job ] || stays_running || { docker logs smoke; exit 1; }
          if [ "$database" = sqlite ]; then
            docker stop smoke
            python3 - "$data_dir/app.db" "$data_dir/before.json" <<'PYSQL'
          import json, shutil, sqlite3, sys, tempfile
          from pathlib import Path
          snapshot_dir = tempfile.TemporaryDirectory()
          shutil.copytree(Path(sys.argv[1]).parent, snapshot_dir.name, dirs_exist_ok=True)
          with sqlite3.connect(str(Path(snapshot_dir.name) / 'app.db')) as db:
              migrations = db.execute('SELECT name FROM schema_migrations ORDER BY name').fetchall()
              events = db.execute('SELECT * FROM events ORDER BY rowid').fetchall()
              assert migrations, 'startup did not apply migrations'
              assert events, 'application did not write data'
              with open(sys.argv[2], 'w') as snapshot:
                  json.dump([migrations, events], snapshot)
          PYSQL
            docker start smoke
            if [ "$kind" = web ]; then
              for _ in $(seq 1 120); do
                curl -fsS "http://127.0.0.1:18080$path" >/dev/null 2>&1 && break
                sleep 1
              done
              curl -fsS "http://127.0.0.1:18080$path" >/dev/null
              curl -fsS http://127.0.0.1:18080/ >/dev/null
            fi
            stays_running || { docker logs smoke; exit 1; }
            docker stop smoke
            python3 - "$data_dir/app.db" "$data_dir/before.json" <<'PYSQL'
          import json, shutil, sqlite3, sys, tempfile
          from pathlib import Path
          snapshot_dir = tempfile.TemporaryDirectory()
          shutil.copytree(Path(sys.argv[1]).parent, snapshot_dir.name, dirs_exist_ok=True)
          with open(sys.argv[2]) as snapshot:
              migrations, events = json.load(snapshot)
          with sqlite3.connect(str(Path(snapshot_dir.name) / 'app.db')) as db:
              actual_migrations = [list(row) for row in db.execute('SELECT name FROM schema_migrations ORDER BY name')]
              actual_events = [list(row) for row in db.execute('SELECT * FROM events ORDER BY rowid')]
              assert actual_migrations == migrations, 'migrations changed or ran twice after restart'
              assert actual_events[:len(events)] == events, 'data did not survive restart'
              assert len(actual_events) > len(events), 'application cannot write after restart'
          print('SQLite migrations, application writes and restart persistence passed')
          PYSQL
          fi
          echo "smoke test passed ($kind${database:+, $database})"

      # Every app type asserts what its image states, before the seed publishes it: the label is on the image
      # the smoke test ran, it is the document the source makes, and it says what the answers say. The job type
      # states `job`, which v2 refuses: a job image is not an instance.
      - name: The image states its declaration (template only)
        if: inputs.template
        env:
          ANSWERS: ${{ inputs.answers }}
          SOURCE_LABEL: ${{ steps.declaration.outputs.labels }}
        run: |
          set -Eeuo pipefail
          labels=$(docker inspect --format '{{json .Config.Labels}}' app:smoke)
          declared=$(python3 -c 'import json, sys; print(json.loads(sys.argv[1]).get("platform.swhurl.com/declaration", ""))' "$labels")
          revision=$(python3 -c 'import json, sys; print(json.loads(sys.argv[1]).get("org.opencontainers.image.revision", ""))' "$labels")
          test -n "$declared" || { echo "the image states no declaration" >&2; exit 1; }
          test "$revision" = "$GITHUB_SHA" || { echo "the image states revision '$revision', not this build's $GITHUB_SHA" >&2; exit 1; }
          test "platform.swhurl.com/declaration=$declared" = "$SOURCE_LABEL" ||
            { echo "the image's declaration is not the source's: $declared" >&2; exit 1; }
          python3 - "$declared" "$ANSWERS" <<'PY'
          import json, sys
          document = json.loads(sys.argv[1])
          answers = dict(pair.split('=', 1) for pair in sys.argv[2].split())
          kind, runtime = answers['kind'], document['runtime']
          assert document['schemaVersion'] == 1, document
          assert runtime['kind'] == kind, (runtime, kind)
          assert runtime['uid'] > 0, runtime
          if kind == 'web':
              assert (runtime['port'], runtime['healthPath']) == (8080, '/healthz'), runtime
          else:
              assert 'port' not in runtime and 'healthPath' not in runtime, runtime
          assert document.get('database') == ('sqlite' if answers['database'] == 'sqlite' else None), document
          assert document.get('publishes') == (['visited'] if kind == 'web' else ['worked']), document
          assert document.get('telemetry') is True, document
          assert document.get('memoryMiB') == 192, document
          assert 'secrets' not in document, document
          print(f'declaration of {kind}: {document}')
          PY

      # Each set of answers' tested image, kept for new apps' seed job (above). Only main's: a release tags a main commit.
      - name: Publish the smoke-tested image as new apps' seed (template main)
        if: inputs.template && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ANSWERS: ${{ inputs.answers }}
        run: |
          set -Eeuo pipefail
          tag="$SEED_IMAGE:seed-$GITHUB_SHA-$(printf '%s' "$ANSWERS" | sed 's/[a-z]*=//g; s/ /-/g')"
          docker tag app:smoke "$tag"
          docker push --quiet "$tag"
          echo "Seed for new apps: \`$tag\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Prove retained export is the smoke-tested image
        if: steps.candidate.outputs.retain == 'true' || env.CHECK_EXPORT == 'true'
        id: retained
        env:
          PYTHONPATH: ${{ runner.temp }}/swhurl-platform/tools
        run: |
          if [ "$CHECK_EXPORT" = true ]; then
            cp "$GITHUB_WORKSPACE/.github/fixtures/oci-proof-state.json" "$RUNNER_TEMP/swhurl-image/state.json"
          fi
          python3 -m swhurl app-build-image retain --state "$RUNNER_TEMP/swhurl-image/state.json" \
            --archive "$RUNNER_TEMP/swhurl-image/image.oci.tar" --proof "$RUNNER_TEMP/swhurl-image/proof.json"

      - name: Retain tested PR image for one day
        if: steps.candidate.outputs.retain == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ steps.retained.outputs.artifact }}
          path: |
            ${{ runner.temp }}/swhurl-image/image.oci.tar
            ${{ runner.temp }}/swhurl-image/proof.json
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Login to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image
        if: env.PUBLISH == 'true' && steps.candidate.outputs.reuse != 'true'
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.APP_DIR }}
          file: ${{ steps.candidate.outputs.dockerfile || format('{0}/Dockerfile', env.APP_DIR) }}
          target: ${{ env.REUSE_ENABLED == 'true' && 'runtime' || '' }}
          platforms: linux/amd64
          push: true
          labels: |
            ${{ steps.declaration.outputs.labels }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          cache-from: ${{ steps.meta.outputs.cache-from }}

      - name: Publish the image already tested on the PR
        if: env.PUBLISH == 'true' && steps.candidate.outputs.reuse == 'true'
        id: reuse
        env:
          PYTHONPATH: ${{ runner.temp }}/swhurl-platform/tools
          IMAGE: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
        run: |
          python3 -m swhurl app-build-image publish --state "$RUNNER_TEMP/swhurl-image/state.json" --image "$IMAGE"
          echo "Reused the tested image from PR run ${{ steps.candidate.outputs.candidate_run }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Record the image
        if: env.PUBLISH == 'true'
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}@${{ steps.reuse.outputs.digest || steps.push.outputs.digest }}"
            echo '```'
            echo
            echo "Staging instances created with the swhurl presets deploy this automatically. For a new"
            echo "instance, paste the line above into the console's New app Image field."
          } >> "$GITHUB_STEP_SUMMARY"
