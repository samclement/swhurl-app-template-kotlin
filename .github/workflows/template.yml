name: Template

# Renders the template (as `make app-repo` does) once per combination of its questions and runs the
# shared app checks on each result: type-check, tests, image build and smoke test. Nothing is published.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  app:
    name: ${{ matrix.answers }}
    strategy:
      fail-fast: false
      matrix:
        # Every combination of the template's questions (copier.yml); add a line when a question is added.
        answers:
          - kind=web database=none
          - kind=web database=sqlite
          - kind=worker database=none
          - kind=worker database=sqlite
    uses: ./.github/workflows/app.yml
    with:
      template: true
      answers: ${{ matrix.answers }}
