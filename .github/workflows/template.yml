name: Template

# Renders the template (as `make app-repo` does) for a set of answers to its questions and runs the
# shared app checks on each result: type-check, tests, image build and smoke test. Nothing is published.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  app:
    name: ${{ matrix.answers }}
    strategy:
      fail-fast: false
      matrix:
        # The defaults, each other choice of the template's questions (copier.yml) on its own, and all of
        # them together for each kind: this grows with the number of choices, not with their product.
        # The platform's make check-templates still renders every combination (it builds nothing).
        answers:
          - kind=web database=none api=none events=none flags=none
          - kind=worker database=none api=none events=none flags=none
          - kind=web database=sqlite api=none events=none flags=none
          - kind=web database=none api=openapi events=none flags=none
          - kind=web database=none api=none events=asyncapi flags=none
          - kind=web database=none api=none events=none flags=example
          - kind=web database=sqlite api=openapi events=asyncapi flags=example
          - kind=worker database=sqlite api=none events=asyncapi flags=example
    uses: ./.github/workflows/app.yml
    with:
      template: true
      answers: ${{ matrix.answers }}
