# Copier template for a swhurl Kotlin (Micronaut) app. The platform renders it with
# `make app-repo NAME=<app> STACK=kotlin` or the console's New app (swhurl-platform).
# By hand: uvx copier copy --data app_name=<app> gh:samclement/swhurl-app-template-kotlin <dir>
_min_copier_version: "9.18"
_subdirectory: template
_answers_file: .copier-answers.yml

app_name:
  type: str
  help: The app's name (its repository, image and platform name)
  validator: >-
    {% if not (app_name | regex_search('^[a-z]([a-z0-9-]{0,38}[a-z0-9])?$')) %}
    must be a DNS label: lowercase letters, digits and hyphens, at most 40 characters
    {% endif %}

description:
  type: str
  help: One line saying what the app does
  default: A swhurl app
  validator: >-
    {% if description | length > 200 or description != (description.split() | join(' ')) %}
    must be one line of at most 200 characters, without leading, trailing or repeated spaces
    {% endif %}

kind:
  type: str
  help: "web: an HTTP service with a health endpoint; worker: a background process with no web address; job: a run on a schedule that does its work and exits"
  choices:
    web: web
    worker: worker
    job: job
  default: web

database:
  type: str
  help: "sqlite: a database file the platform keeps on a volume, backed up nightly, with migrations at startup (APIs; a worker or a job keeps what it needs in an API it calls)"
  choices:
    none: none
    sqlite: sqlite
  default: "{{ 'sqlite' if kind == 'web' else 'none' }}"

api:
  type: str
  help: "openapi: describes the app's HTTP API in openapi.yaml, generated from its controllers, so other apps can find and call it (web only)"
  choices:
    none: none
    openapi: openapi
  default: "{{ 'openapi' if kind == 'web' else 'none' }}"
  # The last question: the answers together must be one of the platform's app types
  # (swhurl-platform tools/swhurl/apps/contract.py APP_TYPES), the only sets this template's CI builds.
  # A type whose answers change keeps its old set here until no app records it.
  validator: >-
    {% set answers = [kind, database, api] | join(' ') %}
    {% if answers not in ['web sqlite openapi', 'worker none none', 'job none none'] %}
    kind={{ kind }} database={{ database }} api={{ api }} is not an app type: api (web sqlite openapi),
    worker (worker none none) or scheduled-job (job none none)
    {% endif %}
