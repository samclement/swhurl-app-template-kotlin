# Copier template for a swhurl Kotlin (Micronaut) app. The platform renders it with
# `make app-repo NAME=<app> STACK=kotlin` or the console's New app (swhurl-platform).
# By hand: uvx copier copy --data app_name=<app> gh:samclement/swhurl-app-template-kotlin <dir>
_min_copier_version: "9.18"
_subdirectory: template
_answers_file: .copier-answers.yml

app_name:
  type: str
  help: The app's name (its repository, image and platform name)
  validator: >-
    {% if not (app_name | regex_search('^[a-z]([a-z0-9-]{0,38}[a-z0-9])?$')) %}
    must be a DNS label: lowercase letters, digits and hyphens, at most 40 characters
    {% endif %}

description:
  type: str
  help: One line saying what the app does
  default: A swhurl app
  validator: >-
    {% if description | length > 200 or description != (description.split() | join(' ')) %}
    must be one line of at most 200 characters, without leading, trailing or repeated spaces
    {% endif %}

kind:
  type: str
  help: "web: an HTTP service with a health endpoint; worker: a background process with no web address"
  choices:
    web: web
    worker: worker
  default: web

database:
  type: str
  help: "sqlite: a database file the platform keeps on a volume, backed up nightly, with migrations at startup"
  choices:
    none: none
    sqlite: sqlite
  default: none

api:
  type: str
  help: "openapi: describes the app's HTTP API in openapi.yaml, generated from its controllers, so other apps can find and call it (web only)"
  choices:
    none: none
    openapi: openapi
  default: none

events:
  type: str
  help: "asyncapi: describes the events the app publishes in asyncapi.yaml, so other apps can find and subscribe to them"
  choices:
    none: none
    asyncapi: asyncapi
  default: none

flags:
  type: str
  help: "example: declares one feature flag in swhurl.yaml (shout, on in staging only) and reads it in the example code; every app can declare flags"
  choices:
    none: none
    example: example
  default: none
